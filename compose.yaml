# harness-jobs: the nightly reconcile (03:00) and the checkpoint collector
# (12:00, 18:00, New York time) in a container, started by hooks/scheduler.mjs,
# which catches up on a window the machine slept through.
#
#   docker compose up -d --build harness-jobs
#   docker compose exec harness-jobs node hooks/scheduler.mjs --run-now nightly
#   docker compose logs -f harness-jobs
#
# It replaces the two host scheduled jobs on the machine that runs it and on no
# other (docs/portable.md, runbook step 7). The store stays where DATABASE_URL
# points; the optional local store is still db/docker-compose.yml.
#
# Usually included by an umbrella compose file with `project_directory` set to
# this repo, which then supplies the variables below from its `.env`. That file
# is interpolation only: it holds paths and names, never a secret.
#
#   VAULT_DIR            required. The folder holding the realm checkouts; mounted at /vault.
#   SECRETS_DIR          the folder holding the two secret files (default ./secrets).
#   HARNESS_MACHINE, HARNESS_GIT_EMAIL, HARNESS_REALMS
#                        what ~/.harness/machine.env says on a host: the name written into
#                        notes and realm commits, the commit email, the realms and their policy.
#   REALM_SYNC           dryrun (default here) | apply | skip, as scripts/nightly-ingest.sh reads
#                        it. The container commits and pushes a realm only once this says apply.
#   HARNESS_CHECKPOINT_REPOS, HARNESS_CHECKPOINT_AUTHORS
#                        optional, comma-separated: checkouts the collector fetches (paths inside
#                        the container) and the author emails it accepts.
#   HARNESS_DATABASE_SSL optional. `disable` for a local Postgres only.
#
# Secrets are files, mounted at /run/secrets/<name>. The entrypoint exports
# DATABASE_URL from harness_database_url; git reads vault_realm_pat when it
# pushes a realm. Neither value is in `environment:`, a build argument or a layer.
#
# No transcripts are mounted. The container's nightly does not sweep sessions
# or session-start state (the image sets HARNESS_JOBS_CONTAINER=1): it cannot
# see the working directories they ran in, and the host's SessionEnd hook is
# the capture path. It reconciles, ingests and syncs the realms.

services:
  harness-jobs:
    build:
      context: .
      dockerfile: docker/jobs/Dockerfile
    image: harness-jobs:local
    restart: unless-stopped
    # On a stop the scheduler passes SIGTERM to the whole process group of the
    # running job and waits for it. Docker's default 10 s before SIGKILL is
    # shorter than one git network call's own limit (120 s for a realm push or
    # pull), so a job that is finishing a push is given time to finish it.
    stop_grace_period: 150s
    environment:
      DATABASE_URL_FILE: /run/secrets/harness_database_url
      VAULT_REALM_PAT_FILE: /run/secrets/vault_realm_pat
      DATABASE_SSL: ${HARNESS_DATABASE_SSL:-}
      HARNESS_MACHINE: ${HARNESS_MACHINE:-}
      HARNESS_GIT_EMAIL: ${HARNESS_GIT_EMAIL:-}
      HARNESS_REALMS: ${HARNESS_REALMS:-}
      REALM_SYNC: ${REALM_SYNC:-dryrun}
      HARNESS_CHECKPOINT_REPOS: ${HARNESS_CHECKPOINT_REPOS:-}
      HARNESS_CHECKPOINT_AUTHORS: ${HARNESS_CHECKPOINT_AUTHORS:-}
    secrets:
      - harness_database_url
      - vault_realm_pat
    volumes:
      # The embedding model (130 MB), downloaded once.
      - fastembed-cache:/cache/fastembed
      # scheduler.json, the run lock, the ingest's last-success record, the eval history.
      - job-state:/state
      # The only host bind: the realms.
      - type: bind
        source: ${VAULT_DIR:?set VAULT_DIR to the folder holding the realm checkouts}
        target: /vault
    # Healthy means a complete nightly ingest finished within 36 hours
    # (`ingest --health`). The first start has none, so the scheduler runs the
    # nightly at once and the 30-minute start period covers it.
    healthcheck:
      test: ["CMD", "uv", "run", "--directory", "/app/ingest", "ingest", "--health"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 30m
      start_interval: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # harness-memory: the memory worker (hooks/memory-worker.mjs) every five
  # minutes and on new queue entries (hooks/memory-loop.mjs), reading the
  # host's Claude Code transcripts and Codex rollout files. It replaces the
  # host's scheduled task AgenticHarness-Memory on the machine that runs it
  # (docs/model-agnostic-memory.md, "Filing and shared state between the host
  # and the container").
  #
  # Behind the profile `memory`: nothing starts it but its name, so a bare
  # `up` cannot start a second worker beside the host's. Start it only at
  # cutover, after the host task is disabled and `memory-worker.mjs
  # --baseline codex` has run:
  #
  #   docker compose --profile memory up -d harness-memory
  #
  # Same image as harness-jobs (built by that service; this one has no build).
  # Least privilege, against harness-jobs: the database secret, not the realm
  # token; transcripts read-only; no checkouts, no Codex database or login,
  # no Hermes, and never a protected folder.
  #
  # The umbrella's variables, each a host path (drive paths on Windows):
  #
  #   CLAUDE_PROJECTS_DIR   the host's ~/.claude/projects            (read-only)
  #   CODEX_DIR             the host's ~/.codex; only sessions/ and archived_sessions/ are mounted (read-only)
  #   HARNESS_STATE_DIR_HOST the host's ~/.harness                    (read-write; machine.env read-only)
  #   HARNESS_HOST_HOME     the host's home as it spells it, C:/Users/<name>
  #   HARNESS_HOST_VAULT    the host's vault as it spells it, C:/Users/<name>/vault
  #   HARNESS_HOST_PATH_FLAVOR  win32 for a Windows host (default)
  #   VAULT_DIR             the vault, as for harness-jobs
  #
  # An unset path falls back to a folder that does not exist, so the service
  # refuses to start rather than run on an empty mount.
  #
  # The host's ~/.harness is mounted where this user's own would be, so the
  # worker reads the host's machine.env, exclusions, session-start records,
  # checkpoints, queue, lock, log and health file. machine.env names host
  # paths (HARNESS_VAULT and others); the image's environment wins over it,
  # which is why HARNESS_VAULT, HARNESS_INGEST_PROJECT and FASTEMBED_CACHE_DIR
  # are set again below. machine.env itself is mounted read-only on top of the
  # writable folder: the container can never change the protected roots the
  # host's hooks read.
  harness-memory:
    profiles: [memory]
    image: ${HARNESS_MEMORY_IMAGE:-harness-jobs:local}
    pull_policy: never
    restart: unless-stopped
    command: ["node", "hooks/memory-loop.mjs"]
    # The loop passes SIGTERM to the running worker, which finishes its
    # synchronous step, releases memory-worker.lock and exits. A run that has
    # not yielded after 90 s is killed by the loop, which then releases the
    # lock itself; this grace leaves time for that.
    stop_grace_period: 150s
    environment:
      DATABASE_URL_FILE: /run/secrets/harness_database_url
      DATABASE_SSL: ${HARNESS_DATABASE_SSL:-}
      HARNESS_HOST_PATH_FLAVOR: ${HARNESS_HOST_PATH_FLAVOR:-win32}
      HARNESS_HOST_HOME: ${HARNESS_HOST_HOME:-}
      HARNESS_HOST_VAULT: ${HARNESS_HOST_VAULT:-}
      HARNESS_VAULT: /vault
      HARNESS_INGEST_PROJECT: /app/ingest
      FASTEMBED_CACHE_DIR: /cache/fastembed
      # The host hooks' switch for starting the host task; inert here, set so
      # it reads the same on both sides.
      HARNESS_MEMORY_START_WORKER: "0"
    secrets:
      - harness_database_url
    volumes:
      - fastembed-cache:/cache/fastembed
      - type: bind
        source: ${CLAUDE_PROJECTS_DIR:-./.memory-unset/claude-projects}
        target: /home/harness/.claude/projects
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CODEX_DIR:-./.memory-unset/codex}/sessions
        target: /home/harness/.codex/sessions
        read_only: true
        bind:
          create_host_path: false
      # Codex makes this folder only when it first archives a thread. It is not
      # created here (Docker would make it as root on a Linux host, and under an
      # unset CODEX_DIR inside this repo): the cutover creates it once
      # (docs/model-agnostic-memory.md).
      - type: bind
        source: ${CODEX_DIR:-./.memory-unset/codex}/archived_sessions
        target: /home/harness/.codex/archived_sessions
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HARNESS_STATE_DIR_HOST:-./.memory-unset/harness}
        target: /home/harness/.harness
        bind:
          create_host_path: false
      - type: bind
        source: ${HARNESS_STATE_DIR_HOST:-./.memory-unset/harness}/machine.env
        target: /home/harness/.harness/machine.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VAULT_DIR:?set VAULT_DIR to the folder holding the realm checkouts}
        target: /vault
    # Healthy means a worker run finished within 15 minutes (`--health`). The
    # file is shared with the host; its `writer` says which side wrote it.
    healthcheck:
      test: ["CMD", "node", "/app/hooks/memory-worker.mjs", "--health"]
      interval: 2m
      timeout: 30s
      retries: 3
      start_period: 15m
      start_interval: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  fastembed-cache:
  job-state:

secrets:
  harness_database_url:
    file: ${SECRETS_DIR:-./secrets}/harness_database_url
  vault_realm_pat:
    file: ${SECRETS_DIR:-./secrets}/vault_realm_pat
